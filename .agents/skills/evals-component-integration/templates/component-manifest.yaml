name: "{{ component }}"
version: 1

runner:
  implementation: "runner.component:ComponentRunner"
  factory: "{{ runner_factory }}"

criteria:
  "{{ criterion_id }}":
    group: "{{ group }}"
    priority: "{{ priority }}"
    spec: "spec/{{ criterion_id }}.md"

    datasets:
      baseline:
        - "datasets/{{ criterion_id }}/baseline.jsonl"

    default_datasets:
      - baseline

    grader:
      family: "{{ grader_family }}"
      implementation: "{{ grader_implementation }}"
      version: "{{ grader_version }}"
      # For an LLM prompt grader, also include:
      # definition: "graders.{{ criterion_id }}:definition"
